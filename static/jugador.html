<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joda RPG — Jugador</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="pagina-jugador">
  <h1>Joda RPG</h1>

  <form id="form-join">
    <label for="input-nombre">Tu nombre</label>
    <input type="text" id="input-nombre" required>

    <h2>Elegí tu personaje</h2>
    <div id="personajes">Cargando personajes...</div>

    <p id="error-join" class="error"></p>
    <button type="submit">Unirme a la partida</button>
  </form>

  <div id="pantalla-espera" class="oculto">
    <p>Estás en la partida, <strong id="nombre-confirmado"></strong>.</p>
    <p>Fase: <strong id="fase-actual">-</strong></p>

    <h2>Nivel de Alcohol</h2>
    <div class="na-meter"><div class="na-fill" id="na-fill"></div></div>
    <p id="na-label"></p>

    <div id="modo-caos" class="oculto"></div>

    <div id="situacion-actual" class="oculto">
      <h2>Situación actual</h2>
      <div class="situacion-card">
        <div class="evento-titulo" id="situacion-titulo"></div>
        <p id="situacion-texto"></p>
        <div id="situacion-opciones"></div>
      </div>
    </div>

    <div id="narracion-ia" class="oculto">
      <h2>📖 Narración</h2>
      <p id="narracion-ia-texto"></p>
    </div>

    <h2>Prenda</h2>
    <div id="prendas-activas"></div>

    <h2>Tirar dado</h2>
    <div id="stats"></div>

    <div id="resultado-tirada" class="oculto">
      <p id="resultado-texto"></p>
    </div>

    <button id="btn-toggle-mapa" type="button">🗺️ ¿Qué está pasando?</button>

    <div id="vista-mapa" class="oculto">
      <h2>Mapa — <span id="mapa-fase-nombre"></span></h2>
      <div id="mapa-zonas-jugador"></div>
      <button id="btn-cerrar-mapa" type="button">← Volver a la partida</button>
    </div>

    <button id="btn-salir-partida" type="button">Salir de la partida</button>
  </div>

  <div id="npc-card-overlay" class="oculto">
    <div class="npc-card-popup">
      <div class="npc-card-avatar" id="npc-card-avatar"></div>
      <div class="eyebrow">NUEVO PERSONAJE</div>
      <h2 id="npc-card-nombre"></h2>
      <p class="npc-card-apodo" id="npc-card-apodo"></p>
      <p id="npc-card-frase"></p>
      <div id="npc-card-lindura"></div>
      <div class="npc-card-actions" id="npc-card-actions"></div>
    </div>
  </div>

  <script src="/static/jugador.js"></script>
</body>
</html>
