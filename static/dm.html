<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Joda RPG — Panel del DM</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Panel del DM</h1>
  <p>Fase actual: <strong id="fase-actual">-</strong></p>
  <button id="btn-avanzar-fase" type="button">⚡ Avanzar fase</button>

  <h2>Eventos de la fase</h2>
  <div id="lista-eventos"></div>

  <h2>Mapa</h2>
  <div id="mapa-zonas"></div>

  <h2>Revelar NPC</h2>
  <div class="revelar-npc-form">
    <select id="select-npc"></select>
    <select id="select-zona-npc"></select>
    <button id="btn-revelar-npc" type="button">Revelar</button>
  </div>

  <h2>Jugadores</h2>
  <ul id="lista-jugadores">
    <li>Cargando...</li>
  </ul>

  <h2>Tiradas</h2>
  <ul id="log-eventos">
    <li>Cargando...</li>
  </ul>

  <script src="/static/dm.js"></script>
</body>
</html>
